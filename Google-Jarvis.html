<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#020812">

<link rel="icon" href="assets/Friday.png">


<link rel="apple-touch-icon" href="assets/Friday.png">

<meta name="mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-title" content="Friday">
  <title>Friday </title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #030814;
      color: #00f0ff;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .hud-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .controls {
      position: absolute;
      bottom: 40px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      background: rgba(3, 12, 28, 0.7);
      padding: 16px 24px;
      border-radius: 12px;
      border: 1px solid rgba(0, 240, 255, 0.3);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
      backdrop-filter: blur(8px);
    }
    .status {
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 8px #00f0ff;
    }
    button {
      background: rgba(0, 240, 255, 0.1);
      color: #00f0ff;
      border: 1px solid #00f0ff;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
    }
    button:hover {
      background: rgba(0, 240, 255, 0.3);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
    }
  </style>
</head>
<body>

  <div class="hud-container">
    <canvas id="jarvisCanvas"></canvas>
    
    <div class="controls">
      <div id="statusText" class="status">SYSTEM IDLE // PRESS TO START</div>
      <button id="micBtn">ACTIVATE MIC</button>
    </div>
  </div>

  <script>
  let ws = null;
  async function startFriday(){

    // const API_URL=window.location.hostname==="localhost"? "http://localhost:8000": "https://friday-production-a794.up.railway.app";
    // const wsUrl=API_URL.replace(/^http:/,"ws:").replace(/^https:/,"wss:")
    // const ws = new WebSocket(`${wsUrl}/ws/live/${sessionId}`);
     ws = new WebSocket(`ws://localhost:8000/ws/live`);

    const canvas = document.getElementById('jarvisCanvas');
    const ctx = canvas.getContext('2d');
    const micBtn = document.getElementById('micBtn');
    const statusText = document.getElementById('statusText');

    let audioCtx, stream, analyser, dataArray, processor, micContext;
    let isListening = false;
    let baseRadius = 110;
    let rotationAngle = 0;
    let activeSources = [];
let aiVolume = 0;
let smoothedAIVolume = 0;
let micVolume = 0;
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const particles = Array.from({ length: 60 }, () => ({
      angle: Math.random() * Math.PI * 2,
      dist: Math.random() * 180 + 120,
      size: Math.random() * 2 + 1,
      speed: (Math.random() - 0.5) * 0.015
    })); 

    audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
    let nextStartTime = 0;

    function stopAllAudio() {
      activeSources.forEach(s => {
        try { s.stop(); } catch(e){}
      });
      activeSources = [];
      if (audioCtx) {
        nextStartTime = audioCtx.currentTime;
      }
    } 

    ws.onmessage = async (event) => {
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }

      const arrayBuffer = await event.data.arrayBuffer();
      const int16Array = new Int16Array(arrayBuffer);
      const float32Array = new Float32Array(int16Array.length);

        let sumSquare = 0;

     for (let i = 0; i < int16Array.length; i++) {
        const sample = int16Array[i] / 32768;
        float32Array[i] = sample;
        sumSquare += sample * sample;}

        const rms = Math.sqrt(
          sumSquare / float32Array.length);

       aiVolume = rms;
      const audioBuffer = audioCtx.createBuffer(1, float32Array.length, 24000);
      audioBuffer.getChannelData(0).set(float32Array);
      
      const source = audioCtx.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(audioCtx.destination);

      if (nextStartTime < audioCtx.currentTime) {
        nextStartTime = audioCtx.currentTime;
      }
      source.start(nextStartTime);
      nextStartTime += audioBuffer.duration;

      activeSources.push(source);
      source.onended = () => {
        activeSources = activeSources.filter(s => s !== source);
        if (activeSources.length === 0) {
      aiVolume = 0;
    }
      };
    };

    async function initAudio() {
      try {
        if (audioCtx.state === 'suspended') {
          await audioCtx.resume();
        }

        stream = await navigator.mediaDevices.getUserMedia({ 
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          } 
        });

        micContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
        console.log(" Mic sample rate:", micContext.sampleRate);
        const source = micContext.createMediaStreamSource(stream);
        processor = micContext.createScriptProcessor(2048, 1, 1);
        analyser = micContext.createAnalyser();
        analyser.fftSize = 64;
        dataArray = new Uint8Array(analyser.frequencyBinCount);

        source.connect(analyser);
        source.connect(processor);

        // FIX 1: Route processor through a muted GainNode to avoid audio loopback
        const muteGain = micContext.createGain();
        muteGain.gain.value = 0;
        processor.connect(muteGain);
        muteGain.connect(micContext.destination);

        processor.onaudioprocess = (e) => {
          if (ws.readyState === WebSocket.OPEN) {
            const inputData = e.inputBuffer.getChannelData(0);
            const pcm16 = new Int16Array(inputData.length);
            
            let sumSquare = 0;
            for (let i = 0; i < inputData.length; i++) {
              const sample = Math.max(-1, Math.min(1, inputData[i]));
              pcm16[i] = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
              sumSquare += sample * sample;
            }

            const rms = Math.sqrt(sumSquare / inputData.length);
            if (rms > 0.05 && activeSources.length > 0) {
               console.log("🎤 USER SPEAKING:", rms);
               stopAllAudio();
            }

            ws.send(pcm16.buffer.slice(0));
          }
        };      

        isListening = true;
        statusText.innerText = "JARVIS ONLINE // LISTENING";
        micBtn.innerText = "MUTE MIC";

      } catch (err) {
        console.error(err);
        statusText.innerText = "MIC ACCESS DENIED // SIMULATION MODE";
      }
    }

function getAudioVolume() {
  if (!isListening || !dataArray) return 0;

  analyser.getByteTimeDomainData(dataArray);

  let sumSquare = 0;

  for (let i = 0; i < dataArray.length; i++) {
    const sample = (dataArray[i] - 128) / 128;
    sumSquare += sample * sample;
  }

  return Math.sqrt(sumSquare / dataArray.length);
}

function drawJARVIS() {
          requestAnimationFrame(drawJARVIS);
        
          const centerX = canvas.width / 2;
          const centerY = canvas.height / 2;
        
          // MIC volume
          const micVolume = isListening
            ? getAudioVolume()
            : 0;
        
          // AI volume
          smoothedAIVolume +=
            (aiVolume - smoothedAIVolume) * 0.15;
        
          // Whoever is speaking drives the animation
          const volume = Math.max(
            micVolume,
            smoothedAIVolume
          );

  // Amplify small RMS values
          const intensity = Math.min(
            volume * 5,1);
        
          ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
          );

         rotationAngle += 0.008 + intensity * 0.03;

       const dynamicRadius =baseRadius + intensity * 60;

      // Outer Ambient Glow
      const glowGrad = ctx.createRadialGradient(centerX, centerY, 10, centerX, centerY, dynamicRadius * 2);
      glowGrad.addColorStop(0, 'rgba(0, 240, 255, 0.25)');
      glowGrad.addColorStop(0.5, 'rgba(0, 150, 255, 0.08)');
      glowGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = glowGrad;
      ctx.beginPath();
      ctx.arc(centerX, centerY, dynamicRadius * 2, 0, Math.PI * 2);
      ctx.fill();

      // Outer Rotating Segmented Ring
      ctx.save();
      ctx.translate(centerX, centerY);
      ctx.rotate(rotationAngle);
      ctx.strokeStyle = `rgba(0, 240, 255, ${0.4 + intensity * 0.6})`;
      ctx.lineWidth = 2;
      for (let i = 0; i < 12; i++) {
        ctx.beginPath();
        ctx.arc(0, 0, dynamicRadius + 20, (i * Math.PI) / 6, (i * Math.PI) / 6 + 0.3);
        ctx.stroke();
      }
      ctx.restore();

      // Counter-rotating Inner Arc Ring
      ctx.save();
      ctx.translate(centerX, centerY);
      ctx.rotate(-rotationAngle * 1.5);
      ctx.strokeStyle = 'rgba(0, 180, 255, 0.6)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 0, dynamicRadius - 15, 0, Math.PI * 0.8);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(0, 0, dynamicRadius - 15, Math.PI, Math.PI * 1.8);
      ctx.stroke();
      ctx.restore();

      // Audio Wave Core Mesh
      const numPoints = 64;
      ctx.beginPath();
      ctx.strokeStyle = '#00f0ff';
      ctx.lineWidth = 2 + intensity * 3;
      ctx.shadowBlur = 15;
      ctx.shadowColor = '#00f0ff';

      for (let i = 0; i <= numPoints; i++) {
        const angle = (i / numPoints) * Math.PI * 2;
        let waveOffset = 0;
        
      if (isListening) {

       const mic = getAudioVolume();
       const intensity = Math.max(mic,smoothedAIVolume);
       waveOffset =intensity * 35;
       waveOffset +=Math.sin(angle * 8 +Date.now() * 0.005) * intensity * 8;} 
        else {
        waveOffset =Math.sin(angle * 8 +Date.now() * 0.005) * 4;}

        const r = dynamicRadius + waveOffset;
        const x = centerX + Math.cos(angle) * r;
        const y = centerY + Math.sin(angle) * r;

        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.stroke();

      // Core Arc Reactor Center
      const coreGrad = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, dynamicRadius * 0.5);
      coreGrad.addColorStop(0, '#ffffff');
      coreGrad.addColorStop(0.4, 'rgba(0, 240, 255, 0.8)');
      coreGrad.addColorStop(1, 'rgba(0, 100, 255, 0)');
      ctx.fillStyle = coreGrad;
      ctx.beginPath();
      ctx.arc(centerX, centerY, dynamicRadius * 0.5, 0, Math.PI * 2);
      ctx.fill();

      // Orbiting Floating Particles
      particles.forEach(p => {
        p.angle += p.speed + intensity * 0.02;
        const px = centerX + Math.cos(p.angle) * (p.dist + intensity * 40);
        const py = centerY + Math.sin(p.angle) * (p.dist + intensity * 40);

        ctx.fillStyle = `rgba(0, 240, 255, ${0.3 + intensity * 0.7})`;
        ctx.beginPath();
        ctx.arc(px, py, p.size, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.shadowBlur = 0;
    }

    micBtn.addEventListener('click', async () => {
      if (!isListening) {
        initAudio();
      } else {
        if (stream) {
          stream.getTracks().forEach(track => track.stop());
        }
        if (micContext) {
          micContext.close();
        }
        stopAllAudio();
        isListening = false;        
        statusText.innerText = "SYSTEM IDLE // PRESS TO START";
        micBtn.innerText = "ACTIVATE MIC";
      }
    });

    drawJARVIS();
  }
  startFriday()
    if("serviceWorker" in navigator){
      window.addEventListener("load",()=>{
        navigator.serviceWorker.register("service-worker.js")
      });
    }
</script>
</body>
</html>
